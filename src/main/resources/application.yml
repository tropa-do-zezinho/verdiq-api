spring:
  application:
    name: verdiq-api
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOSTNAME:localhost}:${ORACLE_PORT:1521}:${ORACLE_SID:ORCL}
    username: ${ORACLE_USERNAME:verdiq}
    password: ${ORACLE_PASSWORD:verdiq}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    validate-on-migrate: false
    # Schema FIAP (ex.: RM564694) costuma não estar vazio e sem histórico Flyway
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  docker:
    compose:
      enabled: false
  cache:
    type: simple
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

naepoca:
  jwt:
    secret: "na-epoca-dev-secret-change-me-please-use-256-bits-minimum-key!!"
    access-token-minutes: 30
    refresh-token-days: 14
  webpush:
    subject: "mailto:admin@naepoca.local"
    public-key: ""
    private-key: ""
  etl:
    prohort:
      base-url: "https://portaldeinformacoes.conab.gov.br"
      user: pentaho
      password: password
    bcb:
      base-url: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados"
    sidra:
      base-url: "https://apisidra.ibge.gov.br"
    ceagesp:
      base-url: "https://www.ceagesp.gov.br"
    cron: "0 30 3 * * *"
  seed:
    demo-password: "Senha@123"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.naepoca: INFO
    org.springframework.security: WARN
